<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>trotro – Sign in</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚌</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --card:#ffffff; --ink:#12302a; --muted:#6b7a75; --line:#dfe5e2;
  --brand:#17554a; --brand-ink:#ffffff; --soft:#edf1ee; --field:#ffffff; --err:#b3261e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:24px 16px}
.card{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:32px 32px 28px;box-shadow:0 1px 3px rgba(18,48,42,.06)}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:34px}
.mark{width:44px;height:44px;border-radius:12px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:22px;font-weight:500}
.brand b{font-size:26px;font-weight:700;letter-spacing:-.01em}
.sub{margin:0 0 6px;font-size:14px;letter-spacing:.03em;text-transform:uppercase;color:var(--brand);font-weight:500}
h1{margin:0 0 10px;font-size:36px;line-height:1.1;font-weight:800;letter-spacing:-.02em}
.lede{margin:0 0 26px;color:var(--muted);font-size:17px;line-height:1.45}
.hidden{display:none!important}

/* role menu */
.roles{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.role{width:100%;display:flex;align-items:center;gap:16px;text-align:left;font:inherit;color:var(--ink);
  background:var(--field);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;transition:border-color .15s,background .15s}
.role:hover{border-color:var(--brand);background:var(--soft)}
.role:focus-visible,.btn:focus-visible,.tab:focus-visible,input:focus-visible,.link:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.ico{flex:none;width:46px;height:46px;border-radius:12px;background:var(--soft);color:var(--brand);display:grid;place-items:center}
.ico svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.role strong{display:block;font-size:17px;font-weight:600}
.role span{display:block;font-size:14px;color:var(--muted);margin-top:2px}
.chev{margin-left:auto;color:var(--muted)}

/* sign in */
.chosen{display:flex;align-items:center;gap:12px;background:var(--soft);border-radius:14px;padding:10px 14px;margin-bottom:22px;font-weight:600;font-size:15px}
.chosen .ico{width:34px;height:34px;border-radius:10px;background:var(--card)}
.chosen .ico svg{width:19px;height:19px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:20px}
.tab{font:inherit;font-size:15px;font-weight:500;color:var(--muted);background:none;border:0;border-radius:11px;padding:10px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
label{display:block;font-size:17px;margin:0 0 10px;font-weight:500}
.field{margin-bottom:20px}
input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:16px;padding:17px 18px}
input::placeholder{color:var(--muted);opacity:.8}
.phone{display:flex;gap:10px}
.phone .cc{flex:none;display:grid;place-items:center;padding:0 16px;border:1px solid var(--line);border-radius:16px;background:var(--soft);font-size:17px;color:var(--muted)}
.btn{width:100%;font:inherit;font-size:17px;font-weight:500;border:0;border-radius:16px;padding:18px;cursor:pointer;transition:filter .15s}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.quiet{background:var(--soft);color:var(--brand);margin-top:12px}
.btn.quiet:hover{filter:brightness(.97)}
.msg{min-height:22px;margin:0 0 14px;font-size:14px;color:var(--err)}
.msg.ok{color:var(--brand)}
.hint{background:var(--soft);border-radius:12px;padding:14px 16px;color:var(--muted);font-size:15px;margin:0 0 12px}
@media (max-width:420px){.card{padding:26px 20px 22px}h1{font-size:31px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="card">
  <div class="brand"><div class="mark">T</div><b>trotro</b></div>

  <!-- Step 1: role menu -->
  <section id="menu">
    <p class="sub">Welcome</p>
    <h1>Who are you?</h1>
    <p class="lede">Choose how you use trotro so we can show you the right tools.</p>
    <ul class="roles" id="roles"></ul>
  </section>

  <!-- Step 2: sign in -->
  <section id="signin" class="hidden">
    <p class="sub" id="roleSub"></p>
    <h1 id="roleTitle"></h1>
    <p class="lede" id="roleLede"></p>

    <div class="chosen" id="chosen"></div>

    <div class="tabs" role="tablist" aria-label="Sign in method">
      <button class="tab" role="tab" id="tabPhone" aria-selected="true" aria-controls="panel">Phone number</button>
      <button class="tab" role="tab" id="tabEmail" aria-selected="false" aria-controls="panel">Email</button>
    </div>

    <div id="panel">
      <div class="field" id="phoneField">
        <label for="phone">Phone number</label>
        <div class="phone"><span class="cc">+233</span><input id="phone" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="24 123 4567"></div>
      </div>
      <div class="field hidden" id="emailField">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" placeholder="Enter your email">
      </div>
      <div class="field">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" placeholder="Enter your password">
      </div>
    </div>

    <p class="msg" id="msg" role="alert"></p>
    <p class="hint" id="hint">Demo hint: demo@station.com / demo123</p>
    <button class="btn primary" id="go">Sign in</button>
    <button class="btn quiet" id="back">Choose a different role</button>
  </section>
</main>

<script>
(function(){
  var ICONS = {
    driver:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 14.5V21M9.6 11H3.2M14.4 11h6.4"/></svg>',
    mate:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M17 8h4M19 6v4"/></svg>',
    commuter:'<svg viewBox="0 0 24 24"><path d="M5 17V7a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v10H5z"/><path d="M5 12h14"/><circle cx="8.5" cy="15" r=".6"/><circle cx="15.5" cy="15" r=".6"/><path d="M7 17v2.5M17 17v2.5"/></svg>',
    manager:'<svg viewBox="0 0 24 24"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/><path d="M2.5 20h19"/></svg>'
  };
  var ROLES = [
    {id:'driver',  name:'Driver',          desc:'See your route, fares and trips.',          lede:'Sign in to see your route, passengers and trips.'},
    {id:'mate',    name:'Mate',            desc:'Collect fares and call passengers.',        lede:'Sign in to record fares and manage the load.'},
    {id:'commuter',name:'Commuter',        desc:'Find trotros, fares and queues.',           lede:'Sign in to find trotros, fares and queue times.'},
    {id:'manager', name:'Station manager', desc:'Update vehicles, fares and the queue.',     lede:'Sign in to update vehicles, fares and the station queue.'}
  ];
  var $ = function(i){return document.getElementById(i)};
  var role = null, mode = 'phone';

  var list = $('roles');
  ROLES.forEach(function(r){
    var li = document.createElement('li');
    li.innerHTML = '<button class="role" data-id="'+r.id+'"><span class="ico">'+ICONS[r.id]+'</span>'+
      '<span><strong>'+r.name+'</strong><span>'+r.desc+'</span></span>'+
      '<svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>';
    list.appendChild(li);
  });

  function show(step){
    $('menu').classList.toggle('hidden', step !== 'menu');
    $('signin').classList.toggle('hidden', step !== 'signin');
    window.scrollTo(0,0);
  }
  function setMode(m){
    mode = m;
    $('tabPhone').setAttribute('aria-selected', m==='phone');
    $('tabEmail').setAttribute('aria-selected', m==='email');
    $('phoneField').classList.toggle('hidden', m!=='phone');
    $('emailField').classList.toggle('hidden', m!=='email');
    $('msg').textContent = '';
    (m==='phone' ? $('phone') : $('email')).focus();
  }
  function say(t, ok){ var m=$('msg'); m.textContent=t; m.classList.toggle('ok', !!ok); }

  list.addEventListener('click', function(e){
    var b = e.target.closest('.role'); if(!b) return;
    role = ROLES.filter(function(r){return r.id===b.dataset.id})[0];
    $('roleSub').textContent = role.name + ' sign in';
    $('roleTitle').textContent = 'Welcome back';
    $('roleLede').textContent = role.lede;
    $('chosen').innerHTML = '<span class="ico">'+ICONS[role.id]+'</span>Signing in as '+role.name.toLowerCase();
    $('pw').value=''; say('');
    show('signin'); setMode('phone');
  });
  $('tabPhone').onclick = function(){ setMode('phone') };
  $('tabEmail').onclick = function(){ setMode('email') };
  $('back').onclick = function(){ show('menu') };

  /* ---- Backend connection ---- */
  var CONFIG = {
    API_URL: window.TROTRO_API_URL || 'http://localhost:8000',   // FastAPI backend
    // Where each role goes after signing in (set to your own pages/apps).
    HOME: { manager:'http://localhost:5173/', driver:'', mate:'', commuter:'' }
  };
  var BACKEND_ROLE = { driver:'driver', mate:'mate', commuter:'commuter', manager:'station_manager' };

  function submit(){
    var pw = $('pw').value, body = { password: pw, role: BACKEND_ROLE[role.id] };
    if(mode==='phone'){
      var digits = $('phone').value.replace(/\D/g,'').replace(/^0/,'');
      if(digits.length !== 9) return say('Enter a 9-digit Ghana number, for example 24 123 4567.');
      body.phone = '+233' + digits;
    } else {
      var em = $('email').value.trim();
      if(!/^\S+@\S+\.\S+$/.test(em)) return say('Enter a valid email address.');
      body.email = em;
    }
    if(!pw) return say('Enter your password.');
    var btn = $('go'); btn.disabled = true; btn.textContent = 'Signing in…'; say('');
    fetch(CONFIG.API_URL + '/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    }).then(function(res){
      return res.json().catch(function(){return {}}).then(function(data){
        if(!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'Something went wrong. Please try again.');
        return data;
      });
    }).then(function(data){
      try{ localStorage.setItem('token', data.token); localStorage.setItem('user', JSON.stringify({name:data.name, role:data.role})); }catch(e){}
      say('Welcome, ' + data.name + '.', true);
      var home = CONFIG.HOME[role.id];
      if(home) setTimeout(function(){ window.location.href = home; }, 600);
    }).catch(function(err){
      say(err instanceof TypeError ? 'Cannot reach the server at ' + CONFIG.API_URL + '. Check that the backend is running and that CORS_ORIGINS includes this page’s address.' : err.message);
    }).then(function(){ btn.disabled = false; btn.textContent = 'Sign in'; });
  }
  $('go').onclick = submit;
  $('signin').addEventListener('keydown', function(e){ if(e.key==='Enter' && e.target.tagName==='INPUT') submit(); });
})();
</script>
</body>
</html>
